version: "3.8"

services:
  app:
    image: ghcr.io/andrespuglla5655/recuperacion:puglla
    container_name: recuperacion_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - FLASK_ENV=production
    networks:
      - app-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

  nginx:
    image: nginx:alpine
    container_name: recuperacion_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - app
    networks:
      - app-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

networks:
  app-network:
    driver: bridge

volumes:
  app-data: