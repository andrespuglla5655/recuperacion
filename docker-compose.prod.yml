version: "3.8"

services:
  app:
    image: ghcr.io/andrespuglla5655/recuperacion:puglla
    container_name: recuperacion_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - FLASK_ENV=production
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge